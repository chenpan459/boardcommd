# Minimal line-based config used by the MVP parser.
#
# transport <name> <type> <endpoint> <local_port> <baudrate> [extra]
# TCP: server | client
# udpkcp: KCP conv id
# UART RS-232: uart or uart232 (default)
# UART RS-485: uart485 / rs485, extra = DE gpio number or 485:17
# channel <name> <transport>
# route <topic|*> <transport>

node_id 1
socket /tmp/boardcommd.sock

# Multiple physical transports.
transport udp0 udp 172.21.62.37:9100 9101 0
transport udp1 udp 127.0.0.1:9201 9200 0
# transport kcp0 udpkcp 127.0.0.1:9101 9100 0 9100
transport tcp0 tcp 0.0.0.0:9300 9300 0 server
transport uart0 uart /dev/ttyS1 0 115200
# transport uart1 uart485 /dev/ttyS2 0 115200 17
# transport uart2 uart /dev/ttyS3 0 115200 485:18

# Application-selected channels. Use bc_write_channel(handle, "control", ...).
channel control udp0
channel telemetry udp1
channel debug tcp0
channel fieldbus uart0

# Topic routes used when the application does not select a channel.
route control.* udp0
route telemetry.* udp1
route debug.* tcp0
route file.* tcp0
route fieldbus.* uart0
route * udp0
